<head>

<link rel=”manifest” href=”/manifest.webmanifest”><meta name=”theme-color” content=”#0b0c12”><link rel=”apple-touch-icon” href=”/icon-192.png”><title>كاردكتور كورولا</title>
<style>
:root{--bg:#0b0c12;--card:#14151d;--line:#2a2b36;--red:#e11d2e;--text:#f3f3f6;--mute:#9a9bab;--amber:#f5a524;--green:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=”light”]){--bg:#0b0c12}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,”Segoe UI”,Arial,sans-serif}
.app{max-width:440px;margin:0 auto;padding:14px 14px 90px}
.hero{text-align:center;padding:10px 0 4px;background:radial-gradient(ellipse at 50% 0,#4a0a12 0,transparent 70%)}
.hero h1{margin:0;font-size:26px}.hero .city{font-size:20px;font-weight:700}.hero .tag{color:#ff6a5e;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.stat{text-align:center;flex:1}.stat small{color:var(--mute);display:block}.stat b{font-size:24px;color:var(--amber)}.stat .d{font-size:13px;color:var(--mute)}
.ring{position:relative;width:130px;height:130px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:24px}.ring .c span{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;color:var(--text);font:inherit;cursor:pointer}
.tile i{font-style:normal;font-size:30px;display:block}.tile b{display:block;font-size:14px;margin-top:4px}.tile small{color:var(--mute);font-size:11px}
input,select{width:100%;background:#0d0e14;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;margin:8px 0}
.btn{width:100%;background:linear-gradient(#f0303f,#b9101e);border:0;color:#fff;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer}
.ok{background:#0f3d22;border:1px solid var(--green);border-radius:16px;padding:12px;text-align:center;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0f1017;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;font-size:11px;color:var(--mute);z-index:4}
.nav div{text-align:center;cursor:pointer;position:relative}.nav .bd{position:absolute;top:-4px;right:8px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;display:none}.nav div:first-child{color:var(--red)}.nav i{font-style:normal;font-size:20px;display:block}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:440px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px;max-height:80vh;overflow:auto}
.sheet h2{margin:0 0 10px}.item{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.x{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;margin-top:12px;cursor:pointer}
.err{color:#ff6a5e;font-size:13px;min-height:16px}
</style>
</head>
